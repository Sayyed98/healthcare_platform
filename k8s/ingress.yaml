
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: hms-ingress

spec:
  ingressClassName: nginx

  rules:
    - host: hms.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8080

