apiVersion: apps/v1
kind: Deployment
metadata: 
  name: user-service
spec: 
  replicas: 2

  selector: 
    matchLabels:
      app: user-service
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: user-service
    
    spec:
      containers:
      - name: user-service
        image: user-service:v1
        imagePullPolicy: IfNotPresent

        ports: 
          - containerPort: 8080

        envFrom:
          - configMapRef:
              name: user-service-config

        env:
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: user-service-secret
                key: DB_PASSWORD
          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: user-service-secret
                key: JWT_SECRET
        
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits: 
            cpu: "500m"
            memory: "512Mi"
        
        startupProbe:
          httpGet: 
            path: /health/startup
            port: 8080
          failureThreshold: 30
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080

        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080

          
